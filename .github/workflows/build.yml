name: Build AnWind APK

# ============================================================================
# 仅手动触发，不绑定 push / pull_request / schedule 等任何自动触发器
# 在 GitHub 仓库 → Actions 标签页 → 选择 "Build AnWind APK" → Run workflow
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "构建类型"
        required: true
        type: choice
        default: "debug"
        options:
          - debug
          - release
          - both
      java_version:
        description: "JDK 版本"
        required: true
        type: choice
        default: "17"
        options:
          - "17"
          - "21"
      gradle_version:
        description: "Gradle 版本（覆盖 wrapper）"
        required: false
        type: string
        default: "8.7"
      upload_apk:
        description: "上传 APK 作为 artifact"
        required: true
        type: boolean
        default: true

# 取消同一分支上正在进行的旧构建
concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.build_type }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ============ 1. 检出代码 ============
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ============ 2. 设置 JDK ============
      - name: ☕ Set up JDK ${{ github.event.inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.java_version }}

      # ============ 3. 设置 Gradle ============
      # 使用 setup-gradle 而非依赖 gradlew，规避 gradle-wrapper.jar 缺失问题
      # 它会安装指定版本的 Gradle 到 PATH，并配置依赖缓存
      # 注意：不使用 setup-android，因为 ubuntu-latest 镜像已预装 Android SDK 34 + build-tools
      - name: 🛠️ Set up Gradle ${{ github.event.inputs.gradle_version }}
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: ${{ github.event.inputs.gradle_version }}
          # 开启缓存，加速二次构建（main 分支可写缓存，其他分支只读）
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ============ 5. 检查 gradle-wrapper.jar 是否存在 ============
      # 如果不存在，自动生成 wrapper（首次推送仓库时常见情况）
      - name: 🔧 Ensure gradle-wrapper.jar exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "⚠️  gradle-wrapper.jar not found, generating it with: gradle wrapper"
            gradle wrapper --gradle-version ${{ github.event.inputs.gradle_version }} --distribution-type bin
            echo "✅ Wrapper generated"
          else
            echo "✅ gradle-wrapper.jar already exists"
          fi
          ls -lh gradle/wrapper/

      # ============ 6. 校验项目结构 ============
      - name: 🔍 Validate project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo ""
          echo "=== Gradle files ==="
          find . -maxdepth 3 -name "*.gradle.kts" -o -name "gradle-wrapper.properties" | sort
          echo ""
          echo "=== AndroidManifest ==="
          test -f app/src/main/AndroidManifest.xml && echo "✓ Manifest found" || (echo "✗ Manifest missing" && exit 1)
          echo ""
          echo "=== Source files count ==="
          find app/src/main/java -name "*.kt" | wc -l
          echo "Kotlin files"
          echo ""
          echo "=== Assets ==="
          find app/src/main/assets -type f | sort

      # ============ 7. 写入 local.properties（SDK 路径） ============
      - name: 📝 Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "✓ local.properties written"
          cat local.properties

      # ============ 8. 构建 Debug APK ============
      - name: 🔨 Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'
        run: gradle assembleDebug --stacktrace --no-daemon

      # ============ 9. 构建 Release APK（不签名，仅编译） ============
      - name: 🔨 Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'
        run: gradle assembleRelease --stacktrace --no-daemon

      # ============ 10. 运行单元测试（可选） ============
      - name: 🧪 Run unit tests
        if: github.event.inputs.build_type == 'debug'
        continue-on-error: true
        run: gradle test --no-daemon || echo "⚠️ Tests skipped or failed (non-blocking)"

      # ============ 11. 列出生成的 APK ============
      - name: 📦 List built APKs
        if: success()
        run: |
          echo "=== Built APK files ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \; || echo "No APK found"
          echo ""
          echo "=== APK details ==="
          for apk in $(find app/build/outputs/apk -name "*.apk" 2>/dev/null); do
            echo "File: $apk"
            if command -v aapt2 >/dev/null 2>&1; then
              aapt2 dump badging "$apk" | head -5
            fi
            echo "---"
          done

      # ============ 12. 上传 APK Artifact ============
      - name: 📤 Upload Debug APK
        if: github.event.inputs.upload_apk == 'true' && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: AnWind-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: 📤 Upload Release APK
        if: github.event.inputs.upload_apk == 'true' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: AnWind-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      # ============ 13. 上传构建报告（失败时排查用） ============
      - name: 📤 Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AnWind-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            build/reports/
            **/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      # ============ 14. 构建摘要 ============
      - name: 📊 Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | \`${{ github.event.inputs.build_type }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| JDK | \`${{ github.event.inputs.java_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Gradle | \`${{ github.event.inputs.gradle_version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Runner | \`ubuntu-latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event.inputs.upload_apk }}" = "true" ]; then
            find app/build/outputs/apk -name "*.apk" 2>/dev/null | while read apk; do
              echo "- \`$(basename $apk)\` ($(du -h "$apk" | cut -f1))" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "- Artifact upload disabled" >> $GITHUB_STEP_SUMMARY
          fi
