name: AnWind Bionic Box64 (aarch64)

# ============================================================
# 构建面向 AnWind bionic rootfs 的 Box64（aarch64 / NDK bionic 链接）
# ------------------------------------------------------------
# 与 rootfsbc 体系同链：NDK r29 clang（api=28）+
# android.toolchain.cmake，上游 -DANDROID=ON 模式
# （BAD_SIGNAL 自动开、内建 wrappedandroidshmem、Release 限 -O1）。
# 产物为 bionic ELF（PT_INTERP=/system/bin/linker64），与 rootfs
# 内 wine / mesa / pulseaudio 等二进制运行形态完全一致。
#
# 历史：v3.2.4~v3.2.5 的 glibc 交叉构建（WINLATOR_GLIBC +
# patchelf 钉 rootfs 私有加载器 ld-linux-aarch64.so.1）与 bionic
# rootfs 不相容（设备上连 box64 自身都起不来），已连配方一并
# 废弃。v3.2.4 报废的直接根因是 CMake ASM 探测命中 NDK 里仅支持
# x86 的 yasm（"unrecognized object format unwind-tables"），
# 现由配方 pre_setup 显式钉死 ASM=NDK clang 根治。
#
# 产物：anwind-box64-<ver>-aarch64-bionic.tar.gz（完整安装集，
# 不止单个 box64 文件）：
#   usr/local/bin/box64                              仿真器本体
#   usr/lib/box64-x86_64-linux-gnu/libc++_shared.so  x86_64 C++ 库
#   usr/etc/box64.box64rc                            系统级调优开关
# 设备安装：解包至 /（data/data/com.anwind/... 布局自动就位），
# anwind-container 自动从 /usr/local/bin/box64 探测。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      box64_ref:
        description: 'Box64 版本（分支 / 标签，如 v0.4.4 / master）'
        required: false
        default: 'v0.4.4'
        type: string
      make_release:
        description: '构建成功后创建 GitHub Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: bionic-box64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-box64:
    name: Bionic Box64 (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ============ 1. 检出代码 ============
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 检查构建系统
        run: |
          if [[ ! -f "${GITHUB_WORKSPACE}/bionic-rootfs/build-rootfs-arch.sh" ]]; then
            echo "::error::未找到 bionic-rootfs/build-rootfs-arch.sh！"
            exit 1
          fi
          if [[ ! -f "${GITHUB_WORKSPACE}/bionic-rootfs/projects/box64/build.sh" ]]; then
            echo "::error::未找到 bionic-rootfs/projects/box64/ 配方！"
            exit 1
          fi
          if [[ -d "${GITHUB_WORKSPACE}/bionic-rootfs/projects/glibc-aarch64" ]]; then
            echo "::error::projects/glibc-aarch64 仍存在（bionic rootfs 不应有宿主 glibc），请先移除！"
            exit 1
          fi
          echo "构建系统与 box64 配方就绪（纯 bionic）"

      # ============ 2. 宿主依赖 ============
      # 只装通用构建工具：box64 走 NDK clang，宿主不需要
      # aarch64 glibc 交叉工具链，也不需要 patchelf
      - name: 安装宿主依赖（host-deps.sh）
        run: |
          sudo -E bash "${GITHUB_WORKSPACE}/bionic-rootfs/host-deps.sh"
          cmake --version | head -1
          ccache --version | head -1

      # ============ 3. 前缀目录 ============
      - name: 准备 AnWind rootfs 前缀目录
        run: |
          sudo mkdir -p /data/data/com.anwind/files/rootfs/usr \
                        /data/data/com.anwind/files/rootfs/home
          sudo chown -R "$(whoami):$(whoami)" /data

      # ============ 4. 缓存 ============
      # 与 build-bionic-rootfs 共用同一 NDK 缓存键（r29）
      - name: 缓存 NDK
        uses: actions/cache@v4
        with:
          path: bionic-rootfs/ndk
          key: anwind-ndk-r29-v1

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: bionic-rootfs/bionic_ccache
          key: anwind-bionic-ccache-aarch64-box64-v2
          restore-keys: |
            anwind-bionic-ccache-aarch64-v2
            anwind-bionic-ccache-aarch64-v1

      # ============ 5. 构建 box64 ============
      # 构建系统自动下载/复用 NDK；配方按 ANWIND_BOX64_REF 检出
      # 指定版本，NDK 补丁状态变化时自动重打
      - name: 构建 Box64 aarch64（NDK bionic）
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/bionic-rootfs"
          chmod +x *.sh
          set -o pipefail
          export ANWIND_BOX64_REF="${{ github.event.inputs.box64_ref }}"
          ./build-rootfs-arch.sh --arch aarch64 \
            --build box64 2>&1 | tee build-box64-aarch64.log

      # ============ 5.5 失败自诊断 ============
      - name: 失败时输出日志尾部
        if: ${{ failure() }}
        shell: bash
        run: |
          LOG="${GITHUB_WORKSPACE}/bionic-rootfs/build-box64-aarch64.log"
          if [[ -f "$LOG" ]]; then
            echo "::error::box64 构建失败！以下是日志最后 150 行（完整日志见 artifact）"
            tail -n 150 "$LOG"
          else
            echo "::error::box64 构建失败且未生成日志文件"
          fi
          echo "=== 磁盘/内存状态 ==="
          df -h / | tail -2
          free -h

      # ============ 6. 产物校验 ============
      # 硬校验：box64 必须是 aarch64 ELF、PT_INTERP 必须是 bionic
      # 的 /system/bin/linker64（出现 ld-linux-aarch64.so.1 即刻失败
      # —— 说明又混入 glibc 方案）；DT_NEEDED 只允许 bionic 系统库；
      # 上游 ANDROID 模式配套的 x86_64 libc++_shared.so 与
      # box64.box64rc 必须在包内
      - name: 校验 box64 产物（bionic 形态 + 完整安装集）
        run: |
          PKG_TAR=$(ls "${GITHUB_WORKSPACE}/bionic-rootfs/pkgs/"box64-*aarch64.tar | head -n 1)
          [[ -n "$PKG_TAR" ]] || { echo "::error::未找到 box64 包 tar"; exit 1; }
          echo "box64 包: $PKG_TAR"

          rm -rf /tmp/box64-verify && mkdir -p /tmp/box64-verify
          tar -xf "$PKG_TAR" -C /tmp/box64-verify

          RFS=/tmp/box64-verify/data/data/com.anwind/files/rootfs/usr
          B="$RFS/local/bin/box64"
          [[ -f "$B" ]] || { echo "::error::box64 二进制缺失（$B）"; exit 1; }

          echo "=== 二进制架构校验（应为 aarch64 ELF） ==="
          file "$B" || true
          if [[ "$(file -b "$B" 2>/dev/null)" == *"ARM aarch64"* ]]; then
            echo "  [OK] aarch64 ELF"
          else
            echo "::error::非 aarch64 ELF，请检查构建"
            exit 1
          fi

          echo "=== PT_INTERP 校验（bionic 形态：/system/bin/linker64） ==="
          INTERP=$(readelf -l "$B" 2>/dev/null | sed -n 's/.*Requesting program interpreter: \(.*\)\]/\1/p' | head -n 1)
          echo "  实际: ${INTERP:-（无 PT_INTERP）}"
          if [[ "$INTERP" == *ld-linux* ]]; then
            echo "::error::box64 混入了 glibc 加载器（$INTERP）—— bionic rootfs 不应有 glibc 产物！"
            exit 1
          fi
          [[ "$INTERP" == "/system/bin/linker64" ]] \
            || { echo "::error::PT_INTERP 不是 bionic 的 /system/bin/linker64！"; exit 1; }
          echo "  [OK] bionic PT_INTERP"

          echo "=== DT_NEEDED 校验（只允许 bionic 系统库） ==="
          readelf -d "$B" 2>/dev/null | grep NEEDED || true
          if readelf -d "$B" 2>/dev/null | grep NEEDED | grep -E "libc\.so\.6|libm\.so\.6|libdl\.so\.2|libpthread\.so\.0|librt\.so\.1|libstdc\+\+|libgcc_s\.so\.1"; then
            echo "::error::box64 链接了 glibc 系 SONAME（libc.so.6 等）—— 不是 bionic 形态！"
            exit 1
          fi
          echo "  [OK] 无 glibc SONAME（bionic 链接：libc.so / libm.so / libdl.so）"

          echo "=== 上游 ANDROID 模式配套文件校验 ==="
          for f in "lib/box64-x86_64-linux-gnu/libc++_shared.so" \
                   "etc/box64.box64rc"; do
            [[ -e "$RFS/$f" ]] && echo "  [OK] $f" \
              || { echo "::error::产物不完整: $RFS/$f"; exit 1; }
          done
          echo "=== 校验通过：bionic box64 + 完整安装集 ==="

      # ============ 7. 打包发行 ============
      - name: 打包 box64 发行包
        run: |
          PKG_TAR=$(ls "${GITHUB_WORKSPACE}/bionic-rootfs/pkgs/"box64-*aarch64.tar | head -n 1)
          BOX64_VER=$(basename "$PKG_TAR" | sed -e 's/^box64-//' -e 's/-aarch64\.tar$//')
          echo "BOX64_VER=${BOX64_VER}" >> "$GITHUB_ENV"
          PACKAGE_NAME="anwind-box64-${BOX64_VER}-aarch64-bionic"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          cd "${GITHUB_WORKSPACE}"
          # /tmp/box64-verify 已含完整安装集（box64 本体 + x86_64
          # libc++_shared.so + box64.box64rc），解包至 / 即自洽
          tar -czf "${PACKAGE_NAME}.tar.gz" -C /tmp/box64-verify .
          sha256sum "${PACKAGE_NAME}.tar.gz" > checksums-box64-aarch64.txt
          echo "=== 打包完成（bionic box64 完整安装集） ==="
          ls -lh "${PACKAGE_NAME}.tar.gz" checksums-box64-aarch64.txt
          tar -tzf "${PACKAGE_NAME}.tar.gz" | head -20

      # ============ 8. 上传日志与产物 ============
      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: box64-build-log-aarch64
          path: bionic-rootfs/build-box64-aarch64.log
          if-no-files-found: ignore

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.tar.gz
            checksums-box64-aarch64.txt
          if-no-files-found: error

      - name: 创建 Release
        if: ${{ github.event.inputs.make_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bionic-box64-${{ env.BOX64_VER }}
          name: AnWind Bionic Box64 ${{ env.BOX64_VER }} (aarch64)
          body: |
            AnWind bionic rootfs 专用 Box64（aarch64 / NDK bionic 链接 / -DANDROID=ON / ARM_DYNAREC）

            - bionic ELF（PT_INTERP=/system/bin/linker64），与 rootfs 内
              wine / mesa / pulseaudio 等二进制同链同形态，无 glibc 产物
            - 完整安装集（不止单个 box64 文件）：
              `usr/local/bin/box64` + `usr/lib/box64-x86_64-linux-gnu/libc++_shared.so`
              （上游 ANDROID 模式配套，被仿真 x86_64 程序的 C++ 标准库）
              + `usr/etc/box64.box64rc`（系统级调优开关）
            - 手动安装: 解包 `anwind-box64-*.tar.gz` 至 /（data/data/com.anwind/...
              自动就位），或 `anwind-container install-box64 <tar.gz|URL>`
            - 安装后 anwind-container 自动探测 /usr/local/bin/box64
            - 用途: 在 aarch64 设备上运行 x86_64 Wine（backend=box64）；
              v0.4.4 为 hangover-11.16 官方配套版本（错配可致 wineboot SEH 级联崩溃）
            - 注意: 与完整 rootfs 包（build-bionic-rootfs）同源 —— rootfs 已内置
              同款 box64 与配套文件，单独升级时才需要本包
          files: |
            ${{ env.PACKAGE_NAME }}.tar.gz
            checksums-box64-aarch64.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
