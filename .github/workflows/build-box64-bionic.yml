name: AnWind Bionic Box64 (aarch64)

# ============================================================
# 构建面向 AnWind bionic rootfs 的 Box64（aarch64 / glibc 链接）
# ------------------------------------------------------------
# v3.2.5：bionic-box64 改为 aarch64 glibc 目标（WINLATOR_GLIBC
# 模型，与终端 box64 build-box64.yml 同款运行形态）：
#   - aarch64-linux-gnu-gcc 交叉构建（host-deps.sh 安装），
#     ARM_DYNAREC + SD845/865/888/8G2 dynarec 调优
#   - patchelf 把 PT_INTERP 钉到 rootfs 私有 glibc 加载器：
#     /data/data/com.anwind/files/rootfs/usr/lib/aarch64-linux-gnu/
#     ld-linux-aarch64.so.1（由 glibc-aarch64 配方随本轮构建安装，
#     构建顺序经 deps 拓扑保证：glibc-aarch64 → box64）
#   - 产物校验 PT_INTERP / RPATH / 加载器存在，发行包捆绑
#     glibc 运行库（usr/lib/aarch64-linux-gnu），解包即自洽
# 旧 -DANDROID=ON/NDK 形态设备实测 wineboot 直接 SIGSEGV(139)
# 零输出，已废弃（详见 projects/box64/build.sh 注释）。
# 产物：anwind-box64-<ver>-aarch64-bionic.tar.gz
#   设备安装：解包至 /（data/data/com.anwind/... 布局，box64 落
#   usr/local/bin，glibc 运行库落 usr/lib/aarch64-linux-gnu），
#   anwind-container 自动从 /usr/local/bin/box64 探测。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      box64_ref:
        description: 'Box64 版本（分支 / 标签，如 v0.4.4 / master）'
        required: false
        default: 'v0.4.4'
        type: string
      make_release:
        description: '构建成功后创建 GitHub Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: bionic-box64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-box64:
    name: Bionic Box64 (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ============ 1. 检出代码 ============
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 检查构建系统
        run: |
          if [[ ! -f "${GITHUB_WORKSPACE}/bionic-rootfs/build-rootfs-arch.sh" ]]; then
            echo "::error::未找到 bionic-rootfs/build-rootfs-arch.sh！"
            exit 1
          fi
          if [[ ! -f "${GITHUB_WORKSPACE}/bionic-rootfs/projects/box64/build.sh" ]]; then
            echo "::error::未找到 bionic-rootfs/projects/box64/ 配方！"
            exit 1
          fi
          echo "构建系统与 box64 配方就绪"

      # ============ 2. 宿主依赖 ============
      - name: 安装宿主依赖（host-deps.sh）
        run: |
          sudo -E bash "${GITHUB_WORKSPACE}/bionic-rootfs/host-deps.sh"
          cmake --version | head -1
          ccache --version | head -1

      # ============ 3. 前缀目录 ============
      - name: 准备 AnWind rootfs 前缀目录
        run: |
          sudo mkdir -p /data/data/com.anwind/files/rootfs/usr \
                        /data/data/com.anwind/files/rootfs/home
          sudo chown -R "$(whoami):$(whoami)" /data

      # ============ 4. 缓存 ============
      - name: 缓存 NDK
        uses: actions/cache@v4
        with:
          path: bionic-rootfs/ndk
          key: anwind-ndk-r28b-v1

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: bionic-rootfs/bionic_ccache
          key: anwind-bionic-ccache-aarch64-box64-v1
          restore-keys: |
            anwind-bionic-ccache-aarch64-v1
            anwind-bionic-ccache-v1

      # ============ 5. 构建 box64 ============
      # deps 拓扑自动补齐 glibc-aarch64（rootfs 私有 glibc 加载器与
      # 运行库），构建顺序：glibc-aarch64 → box64（box64 构建后
      # patchelf 钉死 PT_INTERP 到该加载器）；配方按 ANWIND_BOX64_REF
      # 检出指定版本
      - name: 构建 Box64 aarch64
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/bionic-rootfs"
          chmod +x *.sh
          set -o pipefail
          export ANWIND_BOX64_REF="${{ github.event.inputs.box64_ref }}"
          ./build-rootfs-arch.sh --arch aarch64 \
            --build box64 2>&1 | tee build-box64-aarch64.log

      # ============ 5.5 失败自诊断（把日志尾部直接打进步骤输出） ============
      - name: 失败时输出日志尾部
        if: ${{ failure() }}
        shell: bash
        run: |
          LOG="${GITHUB_WORKSPACE}/bionic-rootfs/build-box64-aarch64.log"
          if [[ -f "$LOG" ]]; then
            echo "::error::box64 构建失败！以下是日志最后 150 行（完整日志见 artifact）"
            tail -n 150 "$LOG"
          else
            echo "::error::box64 构建失败且未生成日志文件"
          fi
          echo "=== 磁盘/内存状态 ==="
          df -h / | tail -2
          free -h

      # ============ 6. 产物校验 ============
      # 硬校验：box64 必须是 aarch64 ELF、PT_INTERP 必须钉到 rootfs
      # 私有 glibc 加载器、RPATH 必须包含 glibc 运行库目录；
      # glibc-aarch64 包里的加载器与 libc 必须在场（发行包会捆绑）
      - name: 校验 box64 产物
        run: |
          PKG_TAR=$(ls "${GITHUB_WORKSPACE}/bionic-rootfs/pkgs/"box64-*aarch64.tar | head -n 1)
          [[ -n "$PKG_TAR" ]] || { echo "::error::未找到 box64 包 tar"; exit 1; }
          echo "box64 包: $PKG_TAR"
          GLIBC_TAR=$(ls "${GITHUB_WORKSPACE}/bionic-rootfs/pkgs/"glibc-aarch64-*aarch64.tar | head -n 1)
          [[ -n "$GLIBC_TAR" ]] || { echo "::error::未找到 glibc-aarch64 包 tar（box64 加载器缺失）"; exit 1; }
          echo "glibc-aarch64 包: $GLIBC_TAR"

          rm -rf /tmp/box64-verify && mkdir -p /tmp/box64-verify
          tar -xf "$PKG_TAR" -C /tmp/box64-verify
          tar -xf "$GLIBC_TAR" -C /tmp/box64-verify

          B=/tmp/box64-verify/data/data/com.anwind/files/rootfs/usr/local/bin/box64
          GLIBCDIR=/tmp/box64-verify/data/data/com.anwind/files/rootfs/usr/lib/aarch64-linux-gnu
          [[ -f "$B" ]] || { echo "::error::box64 二进制缺失"; exit 1; }

          echo "=== 二进制架构校验（应为 aarch64 ELF） ==="
          file "$B" || true
          if [[ "$(file -b "$B" 2>/dev/null)" == *"ARM aarch64"* ]]; then
            echo "  [OK] aarch64 ELF"
          else
            echo "  [!!] 非 aarch64 ELF，请检查构建"; exit 1
          fi

          echo "=== PT_INTERP 校验（必须钉到 rootfs 私有 glibc 加载器） ==="
          EXPECT_INTERP=/data/data/com.anwind/files/rootfs/usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1
          INTERP=$(readelf -l "$B" 2>/dev/null | sed -n 's/.*Requesting program interpreter: \(.*\)\]/\1/p' | head -n 1)
          echo "  期望: $EXPECT_INTERP"
          echo "  实际: ${INTERP:-（无 PT_INTERP）}"
          [[ "$INTERP" == "$EXPECT_INTERP" ]] || { echo "::error::PT_INTERP 未钉到 rootfs 私有加载器！"; exit 1; }
          echo "  [OK] PT_INTERP 已钉死"

          echo "=== RPATH 校验（必须包含 glibc 运行库目录） ==="
          readelf -d "$B" | grep -E "RPATH|RUNPATH" || true
          readelf -d "$B" 2>/dev/null | grep -E "RPATH|RUNPATH" \
            | grep -q "/data/data/com.anwind/files/rootfs/usr/lib/aarch64-linux-gnu" \
            || { echo "::error::RPATH 缺失或不包含 glibc 运行库目录！"; exit 1; }
          echo "  [OK] RPATH 就位"

          echo "=== glibc 运行库校验（随发行包捆绑） ==="
          for f in ld-linux-aarch64.so.1 libc.so.6 libm.so.6 libdl.so.2 \
                   libpthread.so.0 librt.so.1 libstdc++.so.6 libgcc_s.so.1 libz.so.1; do
            [[ -e "$GLIBCDIR/$f" ]] || { echo "::error::glibc 运行库缺失: $GLIBCDIR/$f"; exit 1; }
          done
          echo "  [OK] 加载器与 glibc 运行库齐备（$(ls "$GLIBCDIR" | wc -l) 项）"
          echo "=== 校验通过：box64(glibc) + 私有加载器 + 运行库 ==="

      # ============ 7. 打包发行 ============
      # 发行包捆绑 box64 + 私有 glibc 加载器/运行库（aarch64-linux-gnu
      # 全目录），解包至 / 即自洽 —— 不依赖终端 glibc 系统的任何文件
      - name: 打包 box64 发行包
        run: |
          PKG_TAR=$(ls "${GITHUB_WORKSPACE}/bionic-rootfs/pkgs/"box64-*aarch64.tar | head -n 1)
          BOX64_VER=$(basename "$PKG_TAR" | sed -e 's/^box64-//' -e 's/-aarch64\.tar$//')
          echo "BOX64_VER=${BOX64_VER}" >> "$GITHUB_ENV"
          PACKAGE_NAME="anwind-box64-${BOX64_VER}-aarch64-bionic"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          cd "${GITHUB_WORKSPACE}"
          # /tmp/box64-verify 已含 box64 包 + glibc-aarch64 包的全部内容
          tar -czf "${PACKAGE_NAME}.tar.gz" -C /tmp/box64-verify .
          sha256sum "${PACKAGE_NAME}.tar.gz" > checksums-box64-aarch64.txt
          echo "=== 打包完成（box64 + glibc 运行库） ==="
          ls -lh "${PACKAGE_NAME}.tar.gz" checksums-box64-aarch64.txt

      # ============ 8. 上传日志与产物 ============
      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: box64-build-log-aarch64
          path: bionic-rootfs/build-box64-aarch64.log
          if-no-files-found: ignore

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.tar.gz
            checksums-box64-aarch64.txt
          if-no-files-found: error

      - name: 创建 Release
        if: ${{ github.event.inputs.make_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bionic-box64-${{ env.BOX64_VER }}
          name: AnWind Bionic Box64 ${{ env.BOX64_VER }} (aarch64)
          body: |
            AnWind bionic rootfs 专用 Box64（aarch64 / glibc 链接 / WINLATOR_GLIBC / ARM_DYNAREC）

            - PT_INTERP 已钉到 rootfs 私有 glibc 加载器
              （usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1，随包捆绑）
            - 手动安装: 解包 `anwind-box64-*.tar.gz` 至 /（data/data/com.anwind/... 自动就位：
              box64 → usr/local/bin，glibc 运行库 → usr/lib/aarch64-linux-gnu）
            - 安装后 anwind-container 自动探测 /usr/local/bin/box64
            - 用途: 在 aarch64 设备上运行 x86_64 Wine（backend=box64）；
              v0.4.4 为 hangover-11.16 官方配套版本（错配可致 wineboot SEH 级联崩溃）
            - 注意: 与完整 rootfs 包（build-bionic-rootfs）同源 —— rootfs 已内置
              同款 box64 与加载器，单独升级时才需要本包
          files: |
            ${{ env.PACKAGE_NAME }}.tar.gz
            checksums-box64-aarch64.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
