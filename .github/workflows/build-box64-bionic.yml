name: AnWind Bionic Box64 (aarch64)

# ============================================================
# 构建面向 AnWind bionic rootfs 的 Box64（aarch64 / ARM_DYNAREC）
# ------------------------------------------------------------
# v3.2.6：【glibc 形态修复】旧版用 -DANDROID=ON 以 NDK/bionic 目标
# 构建，设备实测 box64 本体能跑但 wineboot 全量初始化在 ntdll
# unix 侧 SIGSEGV 零输出（bionic 版 box64 缺 glibc 运行语义）。
# 设备侧根因：rootfs 缺 box64 需要的 ld-linux-aarch64.so.1，且
# box64 未 patchelf --set-interpreter 指向它。
# 现构建链（全部在 bionic-rootfs 体系内）：
#   1. deps 自动补齐：先构建 projects/glibc-aarch64（Ubuntu noble
#      arm64 的 libc6/libgcc-s1/libstdc++6/zlib1g，套件索引自动
#      发现存活版本），平铺进 usr/lib/aarch64-linux-gnu/，含
#      ld-linux-aarch64.so.1（bionic 加载器永不搜索该目录）
#   2. box64 用宿主交叉工具链 aarch64-linux-gnu-gcc 按 Linux/
#      glibc 目标构建（noble 同源 glibc 2.39，编译/运行匹配）
#   3. patchelf --set-interpreter 钉死私有加载器 + --set-rpath
#      指向私有库目录（进程内只有这一份 glibc，不与 bionic 混载）
#   4. 发行包同时捆绑私有 glibc 运行库：解包安装即自带加载器，
#      不依赖 rootfs 重装
# 默认 v0.4.4：对齐 hangover-11.16 官方配套（hangover↔box64 的
# PE/wow64 协议版本敏感，错配可致 wineboot SEH 级联崩溃）
# 产物：anwind-box64-<ver>-aarch64-bionic.tar.gz
#   设备安装：anwind-container install-box64（v2.2+ 一键升级，旧版
#   自动备份/验证回滚）；或手动解包至 /（data/data/com.anwind/... 布局），
#   anwind-container 自动从 /usr/local/bin/box64 探测。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      box64_ref:
        description: 'Box64 版本（分支 / 标签，如 v0.4.4 / master）'
        required: false
        default: 'v0.4.4'
        type: string
      make_release:
        description: '构建成功后创建 GitHub Release'
        required: false
        default: true
        type: boolean

concurrency:
  group: bionic-box64-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-box64:
    name: Bionic Box64 (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      # ============ 1. 检出代码 ============
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 检查构建系统
        run: |
          if [[ ! -f "${GITHUB_WORKSPACE}/bionic-rootfs/build-rootfs-arch.sh" ]]; then
            echo "::error::未找到 bionic-rootfs/build-rootfs-arch.sh！"
            exit 1
          fi
          if [[ ! -f "${GITHUB_WORKSPACE}/bionic-rootfs/projects/box64/build.sh" ]]; then
            echo "::error::未找到 bionic-rootfs/projects/box64/ 配方！"
            exit 1
          fi
          echo "构建系统与 box64 配方就绪"

      # ============ 2. 宿主依赖 ============
      - name: 安装宿主依赖（host-deps.sh）
        run: |
          sudo -E bash "${GITHUB_WORKSPACE}/bionic-rootfs/host-deps.sh"
          cmake --version | head -1
          ccache --version | head -1

      # ============ 3. 前缀目录 ============
      - name: 准备 AnWind rootfs 前缀目录
        run: |
          sudo mkdir -p /data/data/com.anwind/files/rootfs/usr \
                        /data/data/com.anwind/files/rootfs/home
          sudo chown -R "$(whoami):$(whoami)" /data

      # ============ 4. 缓存 ============
      - name: 缓存 NDK
        uses: actions/cache@v4
        with:
          path: bionic-rootfs/ndk
          key: anwind-ndk-r28b-v1

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: bionic-rootfs/bionic_ccache
          key: anwind-bionic-ccache-aarch64-box64-v1
          restore-keys: |
            anwind-bionic-ccache-aarch64-v1
            anwind-bionic-ccache-v1

      # ============ 5. 构建 box64 ============
      # 依赖自动补齐：build-rootfs-arch.sh 依据 toposort 先构建
      # glibc-aarch64（私有加载器/运行库）再构建 box64；
      # 配方按 ANWIND_BOX64_REF 检出指定版本
      - name: 构建 Box64 aarch64（glibc 形态 + 私有加载器）
        shell: bash
        run: |
          cd "${GITHUB_WORKSPACE}/bionic-rootfs"
          chmod +x *.sh
          set -o pipefail
          export ANWIND_BOX64_REF="${{ github.event.inputs.box64_ref }}"
          ./build-rootfs-arch.sh --arch aarch64 \
            --build box64 2>&1 | tee build-box64-aarch64.log

      # ============ 5.5 失败自诊断（把日志尾部直接打进步骤输出） ============
      - name: 失败时输出日志尾部
        if: ${{ failure() }}
        shell: bash
        run: |
          LOG="${GITHUB_WORKSPACE}/bionic-rootfs/build-box64-aarch64.log"
          if [[ -f "$LOG" ]]; then
            echo "::error::box64 构建失败！以下是日志最后 150 行（完整日志见 artifact）"
            tail -n 150 "$LOG"
          else
            echo "::error::box64 构建失败且未生成日志文件"
          fi
          echo "=== 磁盘/内存状态 ==="
          df -h / | tail -2
          free -h

      # ============ 6. 产物校验 ============
      # 解包 box64 + glibc-aarch64 两个包到同一棵验证树：既校验二进制
      # 本体，也校验 PT_INTERP/RUNPATH 改写命中、私有加载器与核心
      # 运行库齐全（发行包在步骤 7 原样重打这棵树，校验即发行内容）
      - name: 校验 box64 产物（含私有 glibc 加载器）
        run: |
          PKG_TAR=$(ls "${GITHUB_WORKSPACE}/bionic-rootfs/pkgs/"box64-*aarch64.tar | head -n 1)
          [[ -n "$PKG_TAR" ]] || { echo "::error::未找到 box64 包 tar"; exit 1; }
          GLIBC_TAR=$(ls "${GITHUB_WORKSPACE}/bionic-rootfs/pkgs/"glibc-aarch64-*aarch64.tar | head -n 1)
          [[ -n "$GLIBC_TAR" ]] || { echo "::error::未找到 glibc-aarch64 包 tar（box64 私有加载器来源，deps 未生效？）"; exit 1; }
          echo "box64 包: $PKG_TAR"
          echo "glibc-aarch64 包: $GLIBC_TAR"
          rm -rf /tmp/box64-verify && mkdir -p /tmp/box64-verify
          tar -xf "$PKG_TAR" -C /tmp/box64-verify
          tar -xf "$GLIBC_TAR" -C /tmp/box64-verify
          RFS=/tmp/box64-verify/data/data/com.anwind/files/rootfs
          B="$RFS/usr/local/bin/box64"
          LOADER="$RFS/usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1"
          [[ -f "$B" ]] || { echo "::error::box64 二进制缺失"; exit 1; }
          [[ -f "$LOADER" ]] || { echo "::error::私有 glibc 加载器缺失 => $LOADER"; exit 1; }
          echo "=== 二进制架构校验（应为 aarch64 ELF） ==="
          file "$B" || true
          head -c 20 "$B" | od -An -tx1 | head -1
          AARCH64_MAGIC=$(head -c 20 "$B" | od -An -tx1 | tr -d ' \n' | grep -c '^7f454c4602.*b700')
          if [[ "$(file -b "$B" 2>/dev/null)" == *"ARM aarch64"* ]] || [[ "$AARCH64_MAGIC" != "0" ]]; then
            echo "  [OK] aarch64 ELF"
          else
            echo "  [!!] 非 aarch64 ELF，请检查构建"; exit 1
          fi
          echo "=== PT_INTERP 校验（必须钉死私有加载器） ==="
          readelf -l "$B" | grep -F "/data/data/com.anwind/files/rootfs/usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1" \
            || { echo "::error::PT_INTERP 未指向私有加载器（patchelf 未生效？）"; exit 1; }
          echo "  [OK] 解释器已钉死 usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1"
          echo "=== RUNPATH 校验（必须指向私有 glibc 目录） ==="
          readelf -d "$B" | grep -F "/data/data/com.anwind/files/rootfs/usr/lib/aarch64-linux-gnu" \
            || { echo "::error::RUNPATH 未指向私有 glibc 目录"; exit 1; }
          echo "  [OK] RUNPATH 指向私有 glibc 目录"
          echo "=== 私有 glibc 运行库清单 ==="
          ls "$RFS/usr/lib/aarch64-linux-gnu" | head -30

      # ============ 7. 打包发行 ============
      # /tmp/box64-verify 此时已含 box64 二进制 + 私有 glibc 运行库
      # （步骤 6 解包的同一棵树），原样重打为发行包
      - name: 打包 box64 发行包
        run: |
          PKG_TAR=$(ls "${GITHUB_WORKSPACE}/bionic-rootfs/pkgs/"box64-*aarch64.tar | head -n 1)
          BOX64_VER=$(basename "$PKG_TAR" | sed -e 's/^box64-//' -e 's/-aarch64\.tar$//')
          echo "BOX64_VER=${BOX64_VER}" >> "$GITHUB_ENV"
          PACKAGE_NAME="anwind-box64-${BOX64_VER}-aarch64-bionic"
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          cd "${GITHUB_WORKSPACE}"
          tar -czf "${PACKAGE_NAME}.tar.gz" -C /tmp/box64-verify .
          sha256sum "${PACKAGE_NAME}.tar.gz" > checksums-box64-aarch64.txt
          echo "=== 打包完成（含私有 glibc 加载器/运行库） ==="
          ls -lh "${PACKAGE_NAME}.tar.gz" checksums-box64-aarch64.txt

      # ============ 8. 上传日志与产物 ============
      - name: 上传构建日志
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: box64-build-log-aarch64
          path: bionic-rootfs/build-box64-aarch64.log
          if-no-files-found: ignore

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ env.PACKAGE_NAME }}.tar.gz
            checksums-box64-aarch64.txt
          if-no-files-found: error

      - name: 创建 Release
        if: ${{ github.event.inputs.make_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bionic-box64-${{ env.BOX64_VER }}
          name: AnWind Bionic Box64 ${{ env.BOX64_VER }} (aarch64)
          body: |
            AnWind bionic rootfs 专用 Box64（aarch64 / ARM_DYNAREC / glibc 形态）

            v3.2.6 根因修复：box64 改为 glibc 链接 + patchelf 钉死私有加载器
            `usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1`（旧版 -DANDROID=bionic
            构建，设备实测 wineboot 在 ntdll unix 侧 SIGSEGV 零输出）。

            - 本包自带私有 glibc 运行库（Ubuntu noble arm64，与 box64 同源 2.39）：
              解包安装即自带加载器，不依赖 rootfs 重装
            - 一键升级: `anwind-container install-box64`（v2.2+，旧版自动备份/验证回滚）
            - 手动安装: 解包 `anwind-box64-*.tar.gz` 至 /（data/data/com.anwind/... 自动就位）
            - 安装后 anwind-container 自动探测 /usr/local/bin/box64
            - 用途: 在 aarch64 设备上运行 x86_64 Wine（backend=box64）；
              同时是 hangover 兑底后端的 i386 模拟依赖 —— v0.4.4 为
              hangover-11.16 官方配套版本（错配可致 wineboot SEH 级联崩溃）
          files: |
            ${{ env.PACKAGE_NAME }}.tar.gz
            checksums-box64-aarch64.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
