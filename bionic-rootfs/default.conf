ndkURL="https://dl.google.com/android/repository/android-ndk-r28b-linux.zip"

# GNU source mirror, falls back to https://ftp.gnu.org/pub/gnu if unset
gnuMirrorURL=""

ndkDir="${wsDir}/ndk"
srcDir="${wsDir}/src"
pkgDir="${wsDir}/pkgs"

# AnWind (com.anwind) bionic rootfs 布局：
#   rootfs 根  = /data/data/com.anwind/files/rootfs
#   usr 前缀   = /data/data/com.anwind/files/rootfs/usr
#   home       = /data/data/com.anwind/files/rootfs/home
prefix="/data/data/com.anwind/files/rootfs/usr"
rootfsHome="/data/data/com.anwind/files/rootfs/home"

# AnWind App 侧 termux 前缀（与 bionic rootfs 前缀不同！）。
# AnWind 内置 X 服务（libXlorie / termux-x11）在该目录下的
# tmp/.X11-unix/Xn 监听标准 X11 协议（见 AnWind 仓库
# X11FitClient.kt 与 anwind-x11 脚本）。本构建系统中 xtrans /
# libxcb 的 X11 unix socket 路径补丁使用 @APP_PREFIX@ 占位符，
# 由 patch-rules.sed 展开为此值。修改 App 包名时需同步修改此路径。
appPrefix="/data/data/com.anwind/files/usr"

api="28"

# Set to 1 to clean source directory after project build completes
cleanSrcDir="0"

# extra compile args

cflags=(-O3 -pipe -flto=thin -fvectorize -fslp-vectorize -ffunction-sections -fdata-sections -Wall -Wextra)
cxxflags=(-O3 -pipe -flto=thin -fvectorize -fslp-vectorize -ffunction-sections -fdata-sections -Wall -Wextra)
ldflags=(-s -flto=thin -Wl,--gc-sections -Wl,--as-needed)
